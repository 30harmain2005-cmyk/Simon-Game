<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simon Game</title>
</head>
<body>
    <h1><b>SIMON GAME</b></h1>
    <h2>....</h2>
    <div class="outer">
        <div class="btn one" type="button" id="one"></div>
        <div class="btn two" type="button" id="two"></div>
        <div class="btn three" type="button" id="three"></div>
        <div class="btn four" type="button" id="four"></div>
    </div>
    <button id="button">Start</button>
    <h3 class="highest"></h3>
    <h3 class="score"></h3>
    <p class="message">Press Button to Start game</p>
    <script src="app.js"></script>
   
</body>
</html>
